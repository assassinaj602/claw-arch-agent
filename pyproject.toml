[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claw-arch-agent"
version = "0.1.0"
description = "Lightweight Code Agent for Architectural Specification Synthesis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Muhammad Assad Ullah", email = "23-cs-78@students.uettaxila.edu.pk" }
]
dependencies = [
    "httpx>=0.25.0",
    "openai>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pyinstaller>=6.3.0",
]

[project.scripts]
claw-arch-agent = "src.main_gui:main"
claw-arch-cli = "src.cli_web_fallback:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

