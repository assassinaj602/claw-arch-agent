name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Execute Automated Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Build Standalone Windows Executable
        run: |
          python build_exe.py

      - name: Verify Executable Integrity
        shell: bash
        run: |
          if [ ! -f "dist/ClawArchAgent.exe" ]; then
            echo "[ERR] ClawArchAgent.exe not found in dist/"
            exit 1
          fi
          if [ ! -f "dist/SpaceFractions.exe" ]; then
            echo "[ERR] SpaceFractions.exe not found in dist/"
            exit 1
          fi
          echo "[PASS] Binaries verified in dist/:"
          ls -lh dist/*.exe

      - name: Upload Windows Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Desktop-Executables
          path: dist/*.exe
          if-no-files-found: error

